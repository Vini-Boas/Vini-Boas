<svg xmlns="http://www.w3.org/2000/svg" width="128" height="36" viewBox="0 0 128 36" role="img" aria-label="Idioma / Language: English">
  <style>
    text { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 1px; }
    .track { fill: #681c22; }
    .knob { fill: #D85C63; }
    .on { fill: #ffffff; }
    .off { fill: #e8b4b7; opacity: .75; }
  </style>
  <rect class="track" width="128" height="36" rx="18"/>
  <rect class="knob" x="65" y="3" width="60" height="30" rx="15">
    <animate attributeName="x" from="3" to="65" dur="0.35s" calcMode="spline" keySplines="0.2 0 0 1" keyTimes="0;1" fill="freeze"/>
  </rect>
  <text x="33.0" y="23" text-anchor="middle" class="off">PT</text>
  <text x="95.0" y="23" text-anchor="middle" class="on">EN</text>
</svg>
