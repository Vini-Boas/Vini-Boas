name: Update README stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_USER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require STATS_TOKEN
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret STATS_TOKEN não definido. Crie um PAT com os scopes read:user e repo e adicione-o em Settings > Secrets > Actions."
            exit 1
          fi

      - name: Stats card
        run: python3 scripts/stats_card.py assets/stats.svg

      - name: Top languages card (incl. org repos)
        run: python3 scripts/top_langs.py assets/top-langs.svg

      - name: Update projects table in README
        run: python3 scripts/update_projects.py

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats.en.svg assets/top-langs.svg assets/top-langs.en.svg assets/cards README.md README.en.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi
          git commit -m "chore: update README stats and projects"
          git pull --rebase
          git push
